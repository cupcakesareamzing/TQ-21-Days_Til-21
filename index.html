:root {

* {

body {

.container {

header {

.eyebrow {

h1 {

.line {

.status {

}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}

.day {
  min-height: 135px;
  background: var(--white);

  padding: 18px 12px;

  text-align: center;
  cursor: pointer;

  transition: 0.2s;
}

.day:hover {
  transform: translateY(-3px);
}

.day.locked {

  border-color: #c9c4b9;
  color: #88847c;
  cursor: not-allowed;
  transform: none;
}

  letter-spacing: 2px;
  text-transform: uppercase;

  font-size: 18px;
  margin-top: 9px;
}

.lock {

}

  border: 1px solid var(--gold);
  border-radius: 20px;

  margin: 10px 0;

.birthday p {

footer {

  color: var(--gray);

/* MODAL */

.modal {
  display: none;
  position: fixed;

  background: rgba(16, 42, 67, 0.65);

  align-items: center;
  justify-content: center;

  padding: 18px;
  z-index: 10;

.modal.show {
  display: flex;

.modal-box {
  width: min(650px, 100%);
  max-height: 90vh;
  overflow-y: auto;

  background: var(--white);
  border-radius: 22px;
  border: 1px solid var(--gold-light);

  padding: 32px 25px;

  position: relative;
}

.close {

  background: none;

  color: var(--navy);

.modal-title {

.content {

  font-size: 18px;

.content p {

.button {

.tile {

  border-color: #c5a45e;

.absent {

  color: white;
  border-color: #777d82;

.input-row {

  justify-content: center;
  gap: 8px;

.input-row input {

  padding: 11px;

  border-radius: 10px;

  text-align: center;
  text-transform: uppercase;

  font-weight: bold;

.result {

/* =====================================================
   COUNTDOWN LOGIC
===================================================== */

function dateOnly(date) {

  return new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  );

}


function getDaysUnlocked() {

  const today =
    dateOnly(new Date());

  const start =
    dateOnly(START_DATE);

  const difference =
    Math.floor(
      (today - start) / 86400000
    ) + 1;

  return Math.max(
    0,
    Math.min(21, difference)
  );

}


/* =====================================================
   DISPLAY DAYS
===================================================== */

function renderDays() {

  const unlocked =
    getDaysUnlocked();

  const grid =
    document.getElementById("days");

  grid.innerHTML = "";


  const titles = {

    1: "Love",
    2: "Wordle",
    3: "Math",
    4: "Flowers",
    5: "Mystery",
    6: "A Reminder",
    7: "Coupon",
    8: "Song",
    9: "Appreciation",
    10: "Gift",
    11: "5 Things",
    12: "Random Prize",
    13: "Random Prize",
    14: "Random Prize",
    15: "Random Prize",
    16: "Random Prize",
    17: "Unscramble",
    18: "Joke",
    19: "Wordle",
    20: "Joke",
    21: "Birthday Eve"

  };


  for (
    let i = 1;
    i <= 21;
    i++
  ) {

    const open =
      i <= unlocked;

    const card =
      document.createElement("div");

    card.className =
      "day" +
      (open ? "" : " locked");


    card.innerHTML = `

      <div class="day-number">
        Day ${i}
      </div>

      <div class="day-title">
        ${titles[i]}
      </div>

      ${
        open
          ? ""
          : "<div class='lock'>🔒</div>"
      }

    `;


    if (open) {

      card.onclick =
        () => openDay(i);

    }


    grid.appendChild(card);

  }


  const today =
    dateOnly(new Date());

  const birthday =
    dateOnly(BIRTHDAY_DATE);


  document
    .getElementById("birthday")
    .classList
    .toggle(
      "show",
      today >= birthday
    );


  document
    .getElementById("status")
    .textContent =
      today >= birthday
        ? "The countdown is complete 💙"
        : `${unlocked} of 21 surprises unlocked`;

}

    .getElementById("modalContent")

/* =====================================================

===================================================== */

function closeModal() {

  document
    .getElementById("modal")
    .classList
    .remove("show");

}


document
  .getElementById("modal")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id === "modal"
      ) {

        closeModal();

      }

    }
  );


document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {

      closeModal();

    }

  }
);


/* =====================================================
   WORDLE
===================================================== */

const wordleState = {

  2: {
    guesses: []
  },

  19: {
    guesses: []
  }

};


function makeBoard(
  boardID,
  state
) {

  const board =
    document.getElementById(
      boardID
    );

  board.innerHTML = "";


  state.guesses.forEach(
    guess => {

      [...guess.word].forEach(
        (letter, index) => {

          const tile =
            document.createElement(
              "div"
            );

          tile.className =
            "tile";


          if (
            letter ===
            guess.answer[index]
          ) {

            tile.classList.add(
              "correct"
            );

          }

          else if (
            guess.answer.includes(
              letter
            )
          ) {

            tile.classList.add(
              "present"
            );

          }

          else {

            tile.classList.add(
              "absent"
            );

          }


          tile.textContent =
            letter;

          board.appendChild(
            tile
          );

        }
      );

    }
  );

}


function guessWordle(
  number,
  answer
) {

  const input =
    document.getElementById(
      `wordle${number}input`
    );

  const result =
    document.getElementById(
      `wordle${number}result`
    );


  const value =
    input.value
      .trim()
      .toUpperCase();


  if (
    value.length !== 5
  ) {

    result.textContent =
      "Enter a 5-letter word!";

    return;

  }


  const state =
    wordleState[number];


  if (
    state.guesses.length >= 6
  ) {

    return;

  }


  state.guesses.push({

    word: value,

    answer: answer

  });


  makeBoard(
    `wordle${number}board`,
    state
  );


  input.value = "";


  if (
    value === answer
  ) {

    if (number === 2) {

      result.innerHTML = `
        <strong>
          YOU GOT IT! 🥳💙
        </strong>
        <br>
        You know how much I love Wendy's fries :)
      `;

    }

    else {

      result.innerHTML = `
        <strong>
          YOU GOT IT! 🥳💙
        </strong>
        <br>
        Teddy bear :)
      `;

    }

  }

  else if (
    state.guesses.length >= 6
  ) {

    result.innerHTML = `
      The answer was
      <strong>${answer}</strong>! 😂
    `;

  }

  else {

    result.textContent =
      `${6 - state.guesses.length} guesses left. 👀`;

  }

}


/* =====================================================
   MATH GAME
===================================================== */

function checkMath() {

  const answers = [
    9,
    12,
    15,
    22,
    5,
    25,
    15,
    21,
    21,
    21
  ];


  const values =
    answers.map(
      (_, index) => {

        return Number(
          document.getElementById(
            "m" + (index + 1)
          ).value
        );

      }
    );


  const result =
    document.getElementById(
      "mathresult"
    );


  if (
    values.every(
      (value, index) =>
        value === answers[index]
    )
  ) {

    result.innerHTML = `
      <strong>
        YOU SOLVED IT! 🥳
      </strong>
      <br>
      <span style="font-size:25px">
        I LOVE YOU 🤍
      </span>
    `;

  }

  else {

    result.textContent =
      "Hmm… one or more answers isn't quite right. Check your math and try again! 👀";

  }

}
