<html lang="en">

  <style>
    /* =========================================================
       TQ'S 21 DAYS 'TIL 21
       COLORS
       ========================================================= */

    :root {
      --cream: #f8f5ee;
      --cream-light: #fffdf8;
      --navy: #102a43;
      --navy-light: #1d405f;
      --gold: #b5965c;
      --gold-light: #d8c18f;
      --text: #263746;
      --muted: #7b858d;
      --white: #ffffff;
      --shadow: 0 12px 35px rgba(16, 42, 67, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          var(--cream-light) 0%,
          var(--cream) 60%,
          #eee9df 100%
        );
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font-family: inherit;
    }

    /* =========================================================
       MAIN CONTAINER
       ========================================================= */

    .container {
      width: min(1000px, 92%);
      margin: auto;
      padding: 50px 0 70px;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      text-align: center;
      margin-bottom: 45px;
    }

    .small-title {
      color: var(--gold);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1;
      margin: 0;
      color: var(--navy);
    }

    .for-tq {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-style: italic;
      margin-top: 14px;
      color: var(--navy-light);
    }

    .gold-line {
      width: 70px;
      height: 1px;
      background: var(--gold);
      margin: 25px auto;
    }

    .dates {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* =========================================================
       COUNTDOWN
       ========================================================= */

    .countdown {
      text-align: center;
      margin-bottom: 35px;
    }

    .countdown-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      color: var(--navy);
    }

    .countdown-text {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
    }

    /* =========================================================
       DAY GRID
       ========================================================= */

    .days-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }

    .day-card {
      min-height: 150px;
      border: 1px solid rgba(16, 42, 67, 0.12);
      border-radius: 18px;
      background: rgba(255, 253, 248, 0.92);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      transition: all 0.25s ease;
    }

    button.day-card {
      cursor: pointer;
      color: var(--navy);
    }

    button.day-card:hover:not(:disabled) {
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(16, 42, 67, 0.17);
    }

    .day-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 43px;
      line-height: 1;
    }

    .day-label {
      margin-top: 9px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .day-status {
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
    }

    /* UNLOCKED */

    .unlocked {
      border: 1px solid var(--gold);
      background: linear-gradient(
        145deg,
        #fffdf8,
        #f6efe3
      );
    }

    .unlocked .day-status {
      color: var(--gold);
      font-weight: bold;
    }

    /* LOCKED */

    .locked {
      opacity: 0.55;
      cursor: not-allowed !important;
    }

    .locked .day-number {
      color: #77838d;
    }

    /* =========================================================
       BIRTHDAY SECTION
       ========================================================= */

    .birthday-section {
      display: none;
      margin-top: 30px;
      padding: 45px 25px;
      text-align: center;
      border-radius: 25px;
      background: var(--navy);
      color: var(--white);
      box-shadow: var(--shadow);
    }

    .birthday-section h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6vw, 55px);
      font-weight: 400;
      margin: 12px 0;
    }

    .birthday-section p {
      max-width: 600px;
      margin: 15px auto 25px;
      color: #e5ebf0;
      line-height: 1.7;
    }

    .birthday-button {
      border: 1px solid var(--gold-light);
      background: transparent;
      color: white;
      padding: 13px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
    }

    .birthday-button:hover {
      background: var(--gold);
    }

    /* =========================================================
       MODAL
       ========================================================= */

    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      inset: 0;
      background: rgba(5, 17, 29, 0.72);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: min(680px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--cream-light);
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
    }

    .close-button {
      position: absolute;
      right: 18px;
      top: 13px;
      border: none;
      background: none;
      color: var(--navy);
      font-size: 30px;
      cursor: pointer;
    }

    .modal-day {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .modal-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      font-weight: 400;
      color: var(--navy);
      margin: 10px 0 25px;
    }

    .modal-body {
      color: var(--text);
      line-height: 1.8;
      font-size: 16px;
    }

    .modal-body img {
      max-width: 100%;
      border-radius: 16px;
      margin: 15px 0;
    }

    .modal-body video {
      width: 100%;
      border-radius: 16px;
      margin: 15px 0;
    }

    .modal-body a {
      color: var(--navy);
      font-weight: bold;
    }

    .placeholder {
      border: 1px dashed #b7aa96;
      border-radius: 16px;
      padding: 25px;
      margin-top: 20px;
      background: #fbf7ef;
      text-align: center;
      color: #73766f;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .container {
        padding-top: 35px;
      }

      }

      }

      .modal-content {

      }

      .modal-title {

      }
    }

    @media (max-width: 400px) {

      }

        min-height: 110px;
      }

      .day-number {
        font-size: 30px;
      }
    }
  </style>

/* ============================================================
   CALCULATE WHICH DAY IS UNLOCKED
   ============================================================ */

function getDaysUnlocked() {

  const today = new Date();

  const currentDate = new Date(
    today.getFullYear(),
    today.getMonth(),
    today.getDate()
  );

  const start = new Date(
    START_DATE.getFullYear(),
    START_DATE.getMonth(),
    START_DATE.getDate()
  );

  const difference =
    Math.floor(
      (currentDate - start) / 86400000
    );

  return Math.max(
    0,
    Math.min(21, difference + 1)
  );
}


/* ============================================================
   CREATE THE 21 DAY BUTTONS
   ============================================================ */

function renderDays() {

  const grid =
    document.getElementById("daysGrid");

  const unlocked =
    getDaysUnlocked();

  grid.innerHTML = "";

  for (
    let day = 1;
    day <= 21;
    day++
  ) {

    const isUnlocked =
      day <= unlocked;

    const button =
      document.createElement("button");

    button.className =
      "day-card " +
      (isUnlocked
        ? "unlocked"
        : "locked");

    button.disabled =
      !isUnlocked;

    button.innerHTML = `

      <div class="day-number">
        ${day}
      </div>

      <div class="day-label">
        Day ${day}
      </div>

      <div class="day-status">
        ${
          isUnlocked
            ? "✦ OPEN"
            : "🔒 LOCKED"
        }
      </div>

    `;

    if (isUnlocked) {

      button.onclick =
        function() {
          openDay(day);
        };

    }

    grid.appendChild(button);
  }
}


/* ============================================================
   UPDATE COUNTDOWN
   ============================================================ */

function updateCountdown() {

  const today = new Date();

  const birthday =
    new Date(BIRTHDAY_DATE);

  const difference =
    Math.ceil(
      (birthday - today) / 86400000
    );

  const countdown =
    document.getElementById(
      "countdownNumber"
    );

  if (difference > 0) {

    countdown.textContent =
      difference;

  } else {

    countdown.textContent =
      "21";

  }
}


/* ============================================================
   OPEN A DAY
   ============================================================ */

function openDay(day) {

  const surprise =
    surprises[day];

  if (!surprise) return;

  document.getElementById(
    "modalDay"
  ).textContent =
    "Day " + day;

  document.getElementById(
    "modalTitle"
  ).textContent =
    surprise.title;

  document.getElementById(
    "modalBody"
  ).innerHTML =
    surprise.content;

  document
    .getElementById("modal")
    .classList
    .add("show");
}


/* ============================================================
   OPEN BIRTHDAY SURPRISE
   ============================================================ */

function openBirthday() {

  document.getElementById(
    "modalDay"
  ).textContent =
    "September 24, 2026";

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Happy 21st Birthday, TQ ♡";

  document.getElementById(
    "modalBody"

         ========================================= -->

      Happy 21st birthday, TQ! ♡
    </p>

    <p>

    </p>

    <div class="placeholder">
      ✦ PUT YOUR BIG FINAL BIRTHDAY MESSAGE HERE ✦
      <br><br>
      You can also add photos, videos,
      playlists, or clues about your real-life presents.
    </div>

    <!-- END EDIT -->

  `;

  document
    .getElementById("modal")
    .classList
    .add("show");
}


/* ============================================================
   CLOSE MODAL
   ============================================================ */

function closeModal() {

  document
    .getElementById("modal")
    .classList
    .remove("show");
}


function closeIfOutside(event) {

  if (
    event.target ===
    document.getElementById("modal")
  ) {

    closeModal();

  }

}


/* ============================================================
   SHOW BIRTHDAY SECTION ON SEPTEMBER 24
   ============================================================ */

function checkBirthday() {

  const today = new Date();

  const birthday =
    new Date(BIRTHDAY_DATE);

  const birthdaySection =
    document.getElementById(
      "birthdaySection"
    );

  if (today >= birthday) {

    birthdaySection.style.display =
      "block";

  }

}

updateCountdown();
checkBirthday();

    if (event.key === "Escape") {
      closeModal();
    }

  }
);

</script>
